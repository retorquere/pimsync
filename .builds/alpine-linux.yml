image: alpine/edge
packages:
  - cargo
  - mandoc
  - rsync
  - rust
  - rust-clippy
  - rustfmt
  - scdoc
environment:
  CARGO_TERM_COLOR: always
triggers:
  - action: email
    condition: failure
    to: Hugo Osvaldo Barrera <hugo@whynothugo.nl>
secrets:
  - 2d3090e6-72a6-4d00-8221-92184d276c90 # rsync@anchor
tasks:
  - prepare: |
      cd pimsync
      cargo fetch --locked  # make sure lockfile is up to date
  - check: |
      cd pimsync
      make check
  - docs: |
      cd pimsync
      make docs
  - main-or-tag: |
      cd pimsync
      git diff --no-patch --exit-code origin/main || git describe --tag --exact-match || complete-build
  - publish-doc: |
      cd pimsync
      echo "anchor.whynothugo.nl ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIE2WacYpYEP5vvevx4NXQn3Ktd53pBkZR/bpPoS3Wkyg" > $HOME/.ssh/known_hosts
      if git diff --no-patch --exit-code origin/main; then
        DIR=main
      else
        DIR=$(git describe --tag --exact-match)
      fi
      rsync -r target/doc/ rsync@anchor.whynothugo.nl:./$DIR/lib
      rsync -r target/*.html man-style.css rsync@anchor.whynothugo.nl:./$DIR/
