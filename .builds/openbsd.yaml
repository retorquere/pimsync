image: openbsd/7.6
packages:
  - rust
  - rust-rustfmt
  - rust-clippy
sources:
  - https://git.sr.ht/~whynothugo/pimsync
environment:
  CARGO_TERM_COLOR: always
triggers:
  - action: email
    condition: failure
    to: Hugo Osvaldo Barrera <hugo@whynothugo.nl>
tasks:
  - prepare: |
      cd pimsync
      cargo fetch --locked  # make sure lockfile is up to date
  - check: |
      cd pimsync
      make check
