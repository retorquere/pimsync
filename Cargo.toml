[package]
name = "pimsync"
edition = "2021"
description = "Synchronize calendars and contacts"
homepage = "https://pimsync.whynothugo.nl/"
repository = "https://git.sr.ht/~whynothugo/pimsync"
license = "EUPL-1.2"
build = "build.rs"

[profile.release]
lto = true

[features]
default = ["jmap"]
jmap = ["dep:libjmap", "vstorage/jmap"]

[dependencies]
anyhow = "1.0.75"
base64 = "0.21.1"
camino = { version = "1.1.6" }
futures-util = "0.3.31"
hex = "0.4.3"
hyper = { version = "1", features = ["http1", "client"] }
hyper-rustls = { version = "0.27.0", default-features = false, features = ["ring", "http1", "native-tokio", "tls12", "rustls-native-certs"] }
hyper-util = { version = "0.1.1", features = ["client", "client-legacy", "http1"] }
hyperlocal = "0.9.1"
lexopt = "0.3.0"
libdav = { version = "0.9.3", path = "../libdav" }
libjmap = { version = "0.1.0", path = "../libjmap", optional = true }
log = "0.4.20"
rustix = { version = "0.38.10", features = ["fs"] }
rustls = { version = "0.23.4", default-features = false, features = ["logging", "ring", "tls12"]}
rustls-pemfile = "2.0.0"
scfg = "0.3.1"
sha2 = "0.10.2"
simple_logger = { version = "4.1.0", default-features = false, features = ["colors", "stderr"] }
tempfile = "3.3.0"
thiserror = "1.0.37"
tokio = { version = "1.33.0", features = ["rt-multi-thread", "macros", "rt"] }
tower = "0.4.13"
vstorage = { version = "0.1.1", path = "../vstorage", default-features = false }
